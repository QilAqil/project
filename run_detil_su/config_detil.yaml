# ============================================================
#  Konfigurasi Auto-Paste DETIL Surat Ukur
#  Halaman: Manajemen Dokumen > Surat Ukur > DETIL
# ============================================================

# Hotkey kontrol
trigger_key: f9       # Mulai / lanjut satu record
pause_key:   f10      # Jeda / lanjutkan
reset_key:   f11      # Reset ke record pertama
exit_key:    esc      # Keluar

# Delay antar aksi (detik)
delay:
  antar_field:   0.4
  setelah_klik:  0.5
  setelah_ketik: 0.3
  setelah_tab:   0.2

# ============================================================
#  SERI  –  field dropdown/input di kiri atas form DETIL
# ============================================================
seri:
  enabled: true       # true = isi/ganti, false = biarkan
  nilai: "-"

# ============================================================
#  DAFTAR ISIAN
#
#  Struktur tabel di layar:
#
#            | DI 382      | DI 383      | DI 387      |
#  ----------|-------------|-------------|-------------|
#  Nomor     | 034         | 0           | 120510      |
#  Tahun     | 2020        | 1000        | 2021        |
#  Tanggal   | 25/03/2023  | 01/01/900   | 03/10/2021  |
#
#  Tiap kolom DI punya: nomor, tahun, tanggal
#  Nilai kosong ("") = BIARKAN isian yang sudah ada di layar
# ============================================================
daftar_isian:
  enabled: true

  kolom:
    - id:      "DI 382"
      enabled: true
      image:   "label_di_382.png"   # screenshot header kolom "DI 382"
      nomor:   "034"
      tahun:   "2020"
      tanggal: "25/03/2023"

    - id:      "DI 383"
      enabled: true
      image:   "label_di_383.png"   # screenshot header kolom "DI 383"
      nomor:   "0"
      tahun:   "1000"
      tanggal: "01/01/900"

    - id:      "DI 307"
      enabled: true
      image:   "label_di_307.png"   # screenshot header kolom "DI 307"
      nomor:   "120510"
      tahun:   "2021"
      tanggal: "03/10/2021"

# ============================================================
#  DETAIL LAIN-LAIN
# ============================================================
detail_lain:

  keadaan_tanah:
    enabled: true
    nilai: "Sebidang tanah bekas pertanian"

  tanda_tanda_batas:
    enabled: true
    nilai: >
      Telah terpasang sesuai dengan Peraturan Pemerintah Nomor 24 Tahun 1997
      jo Peraturan Menteri Negara Agraria/ Kepala Badan Pertanahan Nasional
      Nomor 3 Tahun 1997 Pasal 22 Ayat 1.

  pengukuran_dan_pemetaan:
    enabled: true
    nilai: "MUHKSONI"

  hal_lain_lain:
    enabled: true
    nilai: "TIDAK ADA NOMOR GAMBAR UKUR 1871/2021"

# ============================================================
#  IMAGE ASSETS  –  ringkasan file yang perlu disiapkan
#
#  Total asset untuk Daftar Isian: 3 (satu per header kolom)
#  Bukan 9 — cukup klik header kolom, lalu Tab ke Nomor→Tahun→Tanggal
#
#  File yang perlu ada di folder assets/ :
#
#  Navigasi
#    label_tab_detil.png       ← teks tab "DETIL"
#    label_field_seri.png      ← label "Seri" di form atas
#
#  Daftar Isian (3 file)
#    label_di_382.png          ← teks header "DI 382" di tabel
#    label_di_383.png          ← teks header "DI 383" di tabel
#    label_di_307.png          ← teks header "DI 307" di tabel
#
#  Detail Lain-Lain (4 file)
#    label_keadaan_tanah.png
#    label_tanda_batas.png
#    label_pengukuran.png
#    label_hal_lain.png
#
#  Simpan (1 file)
#    label_tanda_seru.png      ← tombol ! / Simpan
#
#  TOTAL: 10 file asset
# ============================================================
